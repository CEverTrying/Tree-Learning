name: Build Desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        if: matrix.os == 'windows-latest'
      - run: npm run test:desktop
        if: matrix.os == 'windows-latest'
        env:
          TREELEARNING_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\TreeLearning.exe
      - run: npm run dist -- --publish never
        if: matrix.os != 'windows-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: TreeLearning-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
